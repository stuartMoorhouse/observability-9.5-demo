spring.application.name=transfer-service
server.port=${PORT:8080}
server.shutdown=graceful
spring.main.banner-mode=off

# Structured JSON (ECS) logs on stdout. MDC entries (trace_id/span_id injected by
# the auto-instrumentation Java agent) are included as top-level fields.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=transfer-service
logging.structured.ecs.service.version=${APP_VERSION:unknown}
logging.structured.ecs.service.environment=banking-demo

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Downstream services
demo.fraud-check-url=${FRAUD_CHECK_URL:http://fraud-check:8080}
demo.accounts-ledger-url=${ACCOUNTS_LEDGER_URL:http://accounts-ledger:8080}
demo.fx-rates-url=${FX_RATES_URL:http://fx-rates:8080}
demo.fault-dir=${FAULT_DIR:/etc/fault}
demo.bad-release=${BAD_RELEASE:false}

# Uncaught exceptions are already recorded on the server span (an APM error with a
# stack trace). Tomcat's own "Servlet.service() threw exception" log would duplicate
# them as an exception log with no APM error group. The outer brackets keep the
# logger name (which contains dots and brackets) as one map key.
logging.level.[org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/].[dispatcherServlet]]=OFF
