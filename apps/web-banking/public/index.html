<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Bank</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/rum-config.js"></script>
  <script src="/bundle.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">Demo Bank</div>
    <div class="tagline">Online banking</div>
  </header>

  <main>
    <section class="card">
      <h2>Your account</h2>
      <label for="account">Account</label>
      <div class="row">
        <select id="account"></select>
        <button type="button" id="refresh" class="secondary">Refresh</button>
      </div>
      <div class="balance-label">Available balance</div>
      <div id="balance" class="balance">...</div>
      <div id="balance-result" class="result" hidden>
        <div class="message"></div>
        <div class="detail"></div>
        <div class="trace-line">trace.id <code class="trace"></code></div>
      </div>
    </section>

    <section class="card">
      <h2>Send money</h2>
      <form id="transfer-form">
        <label for="to-account">To account</label>
        <select id="to-account"></select>

        <label for="amount">Amount (EUR)</label>
        <input id="amount" type="number" min="0.01" step="0.01" value="25.00" required>

        <label for="target-currency">Recipient currency</label>
        <select id="target-currency">
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="USD">USD</option>
          <option value="SEK">SEK</option>
        </select>

        <button type="submit" id="transfer-submit">Send transfer</button>
      </form>
      <div id="transfer-result" class="result" hidden>
        <div class="message"></div>
        <div class="detail"></div>
        <div class="trace-line">trace.id <code class="trace"></code></div>
      </div>
    </section>
  </main>
</body>
</html>
