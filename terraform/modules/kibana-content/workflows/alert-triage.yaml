version: '1'
name: Banking alert triage
enabled: true
description: >-
  Runs the banking-triage Agent Builder agent when the banking error-rate rule raises a new
  alert, and records its findings in an Observability case with the alert attached. The
  agent's conversation is kept, so every tool call can be checked and the investigation
  continued in Agent Builder.
tags:
  - banking-demo
  - ai-triage

# The error-rate rule calls this workflow through its system action (summaryMode false):
# one run per new alert, so one run per service that starts failing. Ongoing alerts do not
# re-run it.
triggers:
  - type: alert

consts:
  kibana_url: "${kibana_url}"

steps:
  # ==========================================================================
  # 1. Investigate. The agent follows the same path as scenario 2 (alert,
  #    service map, correlations, traces, logs) and returns structured output.
  # ==========================================================================
  - name: investigate
    type: ai.agent
    agent-id: ${agent_id}
    create-conversation: true
    timeout: 10m
    with:
      message: |
        A new alert was raised. Investigate it and find the root cause.

        Service: {{ event.alerts[0].service.name }}
        Rule: {{ event.rule.name }}
        Reason: {{ event.alerts[0].kibana.alert.reason }}
        Alert started: {{ event.alerts[0].kibana.alert.start }}
        Environment: ${environment}

        Look at the 30 minutes before the alert started and the time since. Find the root
        cause, and name the change, dependency or component responsible where the data
        shows it. Suggest next steps.

        Alert document:
        {{ event.alerts[0] | json }}
      schema:
        type: object
        properties:
          title:
            type: string
            description: Short case title naming the likely cause, at most 80 characters.
          summary:
            type: string
            description: Two or three sentences on what is happening and its impact.
          root_cause:
            type: string
            description: The most likely root cause, or what is still unknown.
          confidence:
            type: string
            enum: [high, medium, low]
            description: How strongly the evidence supports the root cause.
          evidence:
            type: array
            items:
              type: string
            description: Each finding, with the tool or query that produced it.
          next_steps:
            type: array
            items:
              type: string
            description: Recommended actions, most important first.
          esql_query:
            type: string
            description: An ES|QL query a person can run in Discover to verify the root cause.
        required: [title, summary, root_cause, confidence, evidence, next_steps, esql_query]

  # ==========================================================================
  # 2. Record the findings in an Observability case. syncAlerts is false so
  #    closing the case (reset-demo.sh --full) does not close the alert.
  # ==========================================================================
  - name: create_case
    type: cases.createCase
    with:
      owner: observability
      title: "AI triage: {{ event.alerts[0].service.name }} - {{ steps.investigate.output.structured_output.title }}"
      severity: high
      tags:
        - banking-demo
        - ai-triage
        - "{{ event.alerts[0].service.name }}"
      settings:
        syncAlerts: false
      description: |
        **Generated by the Banking alert triage workflow. Verify the evidence before acting on it.**

        ## Summary
        {{ steps.investigate.output.structured_output.summary }}

        ## Root cause (confidence: {{ steps.investigate.output.structured_output.confidence }})
        {{ steps.investigate.output.structured_output.root_cause }}

        ## Evidence
        {% for item in steps.investigate.output.structured_output.evidence %}- {{ item }}
        {% endfor %}
        ## Next steps
        {% for item in steps.investigate.output.structured_output.next_steps %}1. {{ item }}
        {% endfor %}
        ## Verify in Discover (ES|QL)
        ```esql
        {{ steps.investigate.output.structured_output.esql_query }}
        ```

        ## Agent conversation
        Every tool call and query the agent ran:
        {{ consts.kibana_url }}/app/agent_builder/conversations/{{ steps.investigate.output.conversation_id }}

        Alert: {{ event.rule.name }}, started {{ event.alerts[0].kibana.alert.start }}

  # ==========================================================================
  # 3. Attach the triggering alert to the case.
  # ==========================================================================
  - name: attach_alert
    type: cases.addAlerts
    with:
      case_id: "{{ steps.create_case.output.case.id }}"
      alerts:
        - alertId: "{{ event.alerts[0]._id }}"
          index: "{{ event.alerts[0]._index }}"
          rule:
            id: "{{ event.rule.id }}"
            name: "{{ event.rule.name }}"
