{{- if .Values.loadgen.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen-script
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loadgen
    {{- include "demo-app.labels" . | nindent 4 }}
data:
  script.js: |
    {{- .Files.Get "files/loadgen.js" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loadgen
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        {{- include "demo-app.labels" . | nindent 8 }}
      annotations:
        checksum/script: {{ .Files.Get "files/loadgen.js" | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: demo-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        fsGroup: 12345
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: {{ .Values.loadgen.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["run", "--address", "0.0.0.0:6565", "--quiet", "--no-summary", "/scripts/script.js"]
          env:
            - name: RATE
              value: {{ .Values.loadgen.rate | quote }}
            - name: BASE_URL
              value: "http://web-banking:8080"
            - name: K6_NO_USAGE_REPORT
              value: "true"
          ports:
            - name: api
              containerPort: 6565
              protocol: TCP
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /v1/status
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/status
              port: api
            periodSeconds: 15
          resources:
            {{- toYaml .Values.loadgen.resources | nindent 12 }}
          securityContext:
            {{- include "demo-app.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: script
          configMap:
            name: loadgen-script
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
