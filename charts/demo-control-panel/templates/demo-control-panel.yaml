{{- if not .Values.originSecret }}
{{- fail "originSecret is required: the LoadBalancer is open, and the app only serves requests carrying it" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: demo-control-panel-origin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: demo-control-panel
    app.kubernetes.io/part-of: banking-demo
type: Opaque
stringData:
  origin-secret: {{ .Values.originSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-control-panel-fx-rates
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: demo-control-panel
    app.kubernetes.io/part-of: banking-demo
data:
  manifests.json: {{ .Values.fxRatesManifests | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-control-panel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: demo-control-panel
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-control-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-control-panel
        app.kubernetes.io/part-of: banking-demo
      annotations:
        checksum/fx-rates: {{ .Values.fxRatesManifests | sha256sum | trunc 16 }}
        checksum/origin: {{ .Values.originSecret | sha256sum | trunc 16 }}
    spec:
      # No OTel inject-* annotation: presenter tooling stays out of APM.
      serviceAccountName: demo-control-panel
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-control-panel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KIBANA_URL
              value: {{ .Values.kibanaUrl | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: BASE_VERSION
              value: {{ .Values.baseVersion | quote }}
            - name: BAD_VERSION
              value: {{ .Values.badVersion | quote }}
            - name: DEFAULT_LOAD_RATE
              value: {{ .Values.defaultLoadRate | quote }}
            - name: FX_MANIFESTS
              value: /etc/fx-rates/manifests.json
            - name: ORIGIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-control-panel-origin
                  key: origin-secret
          volumeMounts:
            - name: fx-rates
              mountPath: /etc/fx-rates
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
            seLinuxOptions:
              type: container_t
      volumes:
        - name: fx-rates
          configMap:
            name: demo-control-panel-fx-rates
---
# Classic Load Balancer from the EKS legacy cloud provider (no AWS Load Balancer
# Controller in this cluster). It is the CloudFront origin, so it is open to the
# internet; the app rejects requests without the CloudFront X-Origin-Verify header,
# and the IP allowlist is enforced by AWS WAF on CloudFront.
apiVersion: v1
kind: Service
metadata:
  name: demo-control-panel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: demo-control-panel
    app.kubernetes.io/part-of: banking-demo
  {{- with .Values.loadBalancerTags }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: {{ . | quote }}
  {{- end }}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: demo-control-panel
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
