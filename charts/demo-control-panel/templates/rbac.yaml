apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-control-panel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: demo-control-panel
    app.kubernetes.io/part-of: banking-demo
---
# Namespace-scoped, limited to the objects the scenario scripts touch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-control-panel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: demo-control-panel
    app.kubernetes.io/part-of: banking-demo
rules:
  # Fault toggles
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["fault-config"]
    verbs: ["get", "patch"]
  # Annotate target pods so the kubelet refreshes the mounted ConfigMap now
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "patch"]
  # Bad release, load rate, fx-rates status
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["transfer-service", "loadgen", "fx-rates"]
    verbs: ["get", "patch"]
  # fx-rates onboarding (server-side apply creates) and removal
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["fx-rates"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    resourceNames: ["fx-rates"]
    verbs: ["get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-control-panel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: demo-control-panel
    app.kubernetes.io/part-of: banking-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-control-panel
subjects:
  - kind: ServiceAccount
    name: demo-control-panel
    namespace: {{ .Release.Namespace }}
