# Full image reference (repo:tag), from `terraform output -raw fx_rates_image`
image: fx-rates:1.4.2
imagePullPolicy: IfNotPresent

# OTel Operator Instrumentation CR (<namespace>/<name>)
instrumentationRef: opentelemetry-operator-system/elastic-instrumentation

appVersion: "1.4.2"
environment: banking-demo
replicas: 1
port: 8080

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
